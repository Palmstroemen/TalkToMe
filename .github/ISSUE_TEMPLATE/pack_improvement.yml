name: Language pack improvement
description: Phrases, corpus sentences, word lists or your training corrections for an existing pack.
labels: ["language pack"]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What to add or change
      description: >
        Phrases for a command ("Chamfer: bevel, break the edge"), sentences for the corpus with their
        expected result, words for a list. You can also attach your corrections file
        <UserAppDataDir>/TalkToMe/custom.<language>.json; it is checked with
        tools/corpus.py --with before it goes into the pack.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Speech model, for misheard forms
      placeholder: "base"
